<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula Pairing</title><style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap');
:root{color-scheme:dark;--action:#e75503;--accent:#ff823f;--bg:#090909;--panel:#151210}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(231,85,3,.28) 0,#090909 52%);font-family:'Onest',Segoe UI,sans-serif;color:#f7f4f2}.shell{width:min(920px,92vw);display:grid;grid-template-columns:330px 1fr;gap:32px;align-items:center;padding:32px;border:1px solid rgba(247,244,242,.09);border-radius:28px;background:rgba(21,18,16,.92);box-shadow:0 25px 80px #0008}.qr{background:#fff;padding:18px;border-radius:22px;display:grid;place-items:center}.qr img{width:100%;max-width:290px;display:block}.kicker{color:var(--accent);letter-spacing:.18em;font-size:12px;font-weight:700}h1{font-size:clamp(32px,6vw,58px);line-height:1;margin:12px 0}p{color:#b8aea6;line-height:1.6}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.item{padding:14px;border-radius:14px;background:var(--panel);border:1px solid rgba(247,244,242,.09)}.label{font-size:11px;color:#7d746c;text-transform:uppercase}.value{margin-top:5px;font-weight:700;word-break:break-word}textarea{width:100%;min-height:90px;background:#060504;color:#ffb16f;border:1px solid rgba(255,130,63,.22);border-radius:12px;padding:12px;font-family:Consolas,monospace;font-size:12px}button{margin-top:10px;border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,var(--accent),var(--action));color:#1a0e06;font-weight:700;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:720px){.shell{grid-template-columns:1fr;padding:22px}.qr{max-width:330px;margin:auto}}
</style></head><body><main class="shell"><div class="qr"><img alt="Nebula pairing QR" src="data:image/png;base64,__QR_BASE64__"></div><section><div class="kicker">NEBULA SERVER / SECURE LINK</div><h1>Pair your phone.</h1><p>Open the Nebula Android app, tap <b>Scan Pairing QR</b>, and point the camera at this code.</p><div class="meta"><div class="item"><div class="label">Server address</div><div class="value">__LOCAL_IP__:__PORT__</div></div><div class="item"><div class="label">Version</div><div class="value">__VERSION__</div></div></div><textarea id="payload" readonly>__PAIRING_JSON__</textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('payload').value);this.textContent='COPIED'">COPY PAIRING JSON</button></section></main></body></html>
